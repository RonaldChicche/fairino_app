[project]
name = "edge"
version = "0.0.0"
description = "Servicio edge del glambot: orquesta cada toma junto al robot"
requires-python = ">=3.11,<3.14"
dependencies = [
    "open-gopro",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["vendor"]

