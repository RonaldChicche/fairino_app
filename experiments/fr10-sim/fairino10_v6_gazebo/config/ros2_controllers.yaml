# ros2_control para Gazebo Sim (cargado por el plugin gz_ros2_control dentro de Gazebo)
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    fairino10_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

fairino10_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      # 0.0 = no verificar; la gravedad deja una oscilación residual mínima en simulación
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
